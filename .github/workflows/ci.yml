name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Two-OS matrix: golden hashes must be bit-identical across platforms,
    # catching any float/HashMap determinism slip immediately.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determinism guard (no ambient RNG in core)
        shell: bash
        run: |
          ! grep -rnE "thread_rng|from_entropy" crates/derelict_core/src
      - name: Tests
        run: cargo test -p derelict_core
      - name: CLI smoke
        run: cargo run -p derelict_cli -- --sweep 5 --archetype frigate
