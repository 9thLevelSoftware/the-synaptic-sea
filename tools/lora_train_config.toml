# Documented SDXL LoRA settings for the Synaptic Sea salvage-industrial style.
# tools/train_lora.sh is the executable source of truth for the training command.

[dataset]
train_data_dir = "data/training/lora_synaptic_sea/raw"
resolution = 1024
train_batch_size = 1
caption_extension = ".txt"

[model]
pretrained_model_name_or_path = "/Users/christopherwilloughby/Documents/comfy/ComfyUI/models/checkpoints/sd_xl_base_1.0.safetensors"
network_module = "networks.lora"
network_dim = 32
network_alpha = 16

[optimization]
max_train_epochs = 10
learning_rate = 0.0001
optimizer_type = "AdamW8bit"
lr_scheduler = "cosine"
seed = 42

[checkpointing]
output_dir = "data/training/lora_synaptic_sea/output"
output_name = "synaptic_sea_style"
save_every_n_epochs = 2
save_model_as = "safetensors"

[performance]
mixed_precision = "fp16"
cache_latents = true
num_cpu_threads_per_process = 1

[environment]
# Expected Kohya checkout used by tools/train_lora.sh.
sd_scripts = "~/Documents/comfy/sd-scripts"
# The wrapper creates a Python 3.11 virtual environment at ${sd_scripts}/.venv.
